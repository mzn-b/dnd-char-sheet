apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnd-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # Don't keep superseded ReplicaSets around after a rollout; rollbacks go through Git/Argo CD instead.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dnd-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dnd-app
    spec:
      # Only needed while the GHCR package is private; ignored if the secret doesn't exist.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: ghcr.io/mzn-b/dnd-char-sheet
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            # Let Node's heap use most of the 4Gi limit (it otherwise stops well short of it).
            - name: NODE_OPTIONS
              value: --max-old-space-size=3072
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dnd-db
                  key: url
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            # Startup waits up to a minute for Postgres and runs migrations.
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            # A higher CPU request keeps the API responsive when the node is busy (the share a pod gets under
            # contention follows its request).
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
