# Development credentials for a local kind cluster. For a shared or public cluster, keep these out of git
# (Sealed Secrets, External Secrets, or `kubectl create secret`) and drop this file.
apiVersion: v1
kind: Secret
metadata:
  name: dnd-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: dnd
  password: dnd-kind-dev
  database: dnd
  url: postgres://dnd:dnd-kind-dev@dnd-postgres:5432/dnd
