apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dnd-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: dnd-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dnd-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dnd-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: dnd-db, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: dnd-db, key: password } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: dnd-db, key: database } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
