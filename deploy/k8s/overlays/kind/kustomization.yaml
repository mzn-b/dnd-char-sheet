# What Argo CD deploys to the kind cluster: the app and its own Postgres in namespace "dnd".
# Reached through Traefik at http://dnd.mazen.home (ingressroute.yaml); the Service itself is a plain
# ClusterIP, so `kubectl -n dnd port-forward svc/dnd-app 8080:80` works too.
# For a fixed port on the host instead, point the Argo CD Application at ../kind-nodeport.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dnd
resources:
  - ../../base
  - ingressroute.yaml
components:
  - ../../components/postgres
images:
  - name: ghcr.io/mzn-b/dnd-char-sheet
    # Updated by the "Container image" workflow on every push to the default branch.
    newTag: sha-2a95ee9
