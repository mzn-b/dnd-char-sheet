# Optional: the kind overlay plus a fixed NodePort, for clusters created with deploy/kind/cluster.yaml
# (which maps NodePort 30480 to http://localhost:8080). NodePorts are cluster-wide: if another service
# already uses 30480, Argo CD reports "provided port is already allocated"; pick a free port in
# 30000-32767 here and in cluster.yaml (or use the plain kind overlay with port-forward).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kind
patches:
  - target:
      kind: Service
      name: dnd-app
    patch: |
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30480
