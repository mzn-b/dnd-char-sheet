services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd}
      POSTGRES_DB: ${POSTGRES_DB:-dnd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dnd} -d ${POSTGRES_DB:-dnd}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the whole app in containers with `docker compose --profile app up --build`
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dnd}:${POSTGRES_PASSWORD:-dnd}@db:5432/${POSTGRES_DB:-dnd}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

volumes:
  pgdata:
